name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt
          npm ci

      # Blocking. Declared Python requirements must have no known advisory.
      # There is no allowlist here: at the time of writing pip-audit reports a
      # clean tree, so any finding is new and must be triaged, not waived.
      - name: Security gate — Python dependency audit (blocking)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r apps/api/requirements.txt

      # Blocking. Compares production npm findings against an explicit,
      # documented allowlist rather than a severity threshold. New advisories,
      # new packages, version drift, and changed dependency paths all fail.
      # See scripts/security/npm-audit-allowlist.mjs for why each accepted
      # residual is unreachable and what would invalidate that reasoning.
      - name: Security gate — production npm audit policy (blocking)
        run: node scripts/security/check-npm-audit.mjs

      - name: Verify npm audit policy script
        run: node --test scripts/security/check-npm-audit.test.mjs

      # NOT a security gate. Development and build tooling only — the known
      # cluster under @capacitor/assets (tar, minimatch, brace-expansion,
      # uuid, sharp 0.32.6) has no upgrade path in tree and never runs in
      # production or CI. Reported for visibility; deliberately non-blocking.
      # Production exposure is gated by the blocking step above, not here.
      - name: Dependency report — development tooling advisories (informational)
        continue-on-error: true
        run: npm audit

      - name: Check support-purchase copy
        run: npm run lint:support-copy

      - name: Start local Supabase and apply migrations
        run: |
          supabase start
          supabase db reset

      - name: Configure local test environment
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"

          # SUPABASE_ANON_KEY is required by the PostgREST exposure tests, which
          # must reach the HTTP boundary as an ordinary client. APP_ENV is
          # deliberately NOT written here: a .env file can no longer supply the
          # deployment-mode switch (app/core/config.py load_environment), so it is
          # exported into the real process environment on the test step instead.
          cat > apps/api/.env <<EOF
          SUPABASE_URL=$API_URL
          SUPABASE_DB_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_JWT_SECRET=$JWT_SECRET
          CORS_ALLOW_ORIGINS=http://127.0.0.1:3000,http://localhost:3000
          EOF

          cat > apps/web/.env.local <<EOF
          NEXT_PUBLIC_API_URL=http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY
          EOF

      - name: Run backend tests
        working-directory: apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api
          # Explicit, and in the real process environment: the deployment-mode
          # switch is intentionally no longer readable from a .env file.
          APP_ENV: test
        run: python -m pytest tests/ -q

      - name: Run frontend unit tests
        run: npm run test --workspace=@smart-expense/web

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start API for browser acceptance tests
        working-directory: apps/api
        env:
          # Previously inherited from apps/api/.env; now that a file cannot supply
          # the deployment-mode switch it is stated explicitly, preserving the
          # behaviour the acceptance suite already ran against.
          APP_ENV: test
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"

      - name: Run frontend acceptance tests
        working-directory: apps/web
        # Visual regression is excluded here: bare ubuntu-latest renders fonts
        # differently from the Linux baselines, which are captured in the
        # dedicated `visual-regression` container job below against the exact
        # mcr.microsoft.com/playwright:v1.61.1-noble image.
        run: npx playwright test e2e --workers=1 --grep-invert "design refresh visual regression"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          if-no-files-found: ignore
          path: |
            apps/web/test-results
            apps/web/playwright-report
            ${{ runner.temp }}/api.log

  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt
          npm ci

      - name: Start local Supabase and apply migrations
        run: |
          supabase start
          supabase db reset

      - name: Configure local test environment
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"

          # APP_ENV is exported on the API step below rather than written here:
          # a .env file can no longer supply the deployment-mode switch.
          cat > apps/api/.env <<EOF
          SUPABASE_URL=$API_URL
          SUPABASE_DB_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_JWT_SECRET=$JWT_SECRET
          CORS_ALLOW_ORIGINS=http://127.0.0.1:3000,http://localhost:3000
          EOF

          cat > apps/web/.env.local <<EOF
          NEXT_PUBLIC_API_URL=http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY
          EOF

      - name: Start API for browser acceptance tests
        working-directory: apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api
          APP_ENV: test
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"

      - name: Wait for API health check
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "API failed health check" >&2
          cat "$RUNNER_TEMP/api.log" || true
          exit 1

      # Runs only the visual-regression spec inside the exact Playwright image
      # used to capture the committed Linux baselines, so CI renders
      # pixel-for-pixel identically to how they were generated.
      # --network host (a plain `docker run` flag, not a job-level
      # `container:` option, which GitHub Actions does not support) puts the
      # container on the runner's own network namespace, so it reaches
      # Supabase and the FastAPI server above via 127.0.0.1 with no extra
      # networking setup, and Next.js picks up apps/web/.env.local
      # (bind-mounted from the workspace) at build time automatically.
      - name: Run visual regression tests in pinned Playwright image
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e CI=true \
            mcr.microsoft.com/playwright:v1.61.1-noble \
            bash -lc "npm ci && cd apps/web && npx playwright test e2e/visual-regression.spec.ts --workers=1 --project=chromium --project=mobile-rtl"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-regression-results
          if-no-files-found: ignore
          path: |
            apps/web/test-results
            apps/web/playwright-report
            ${{ runner.temp }}/api.log
